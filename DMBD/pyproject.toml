[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmbd"
version = "0.1.0"
description = "Dynamic Markov Blanket Detection Framework"
# No `readme` field: the project README lives at the repository root, outside
# this build root, so pointing at it breaks the build.
requires-python = ">=3.8"
license = {text = "CC BY-NC-SA 4.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "tqdm>=4.64.0",
    "networkx>=3.0",
    "seaborn>=0.12.0",
]

[project.urls]
"Homepage" = "https://github.com/docxology/Markov_Blanket_Detection"
"Bug Tracker" = "https://github.com/docxology/Markov_Blanket_Detection/issues"

# Explicit package list: flat-layout auto-discovery would fail on the two
# top-level packages (`framework`, `src`) this project installs.
[tool.setuptools]
packages = ["framework", "src"]
